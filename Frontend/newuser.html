<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add New User</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./newuser.css" />
  </head>
  <body>
    <div class="container py-4">
      <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
          <div class="glass-card p-4 p-md-5 rounded-4 shadow-lg">
            <h1 class="text-center text-gradient mb-4 pb-2 fw-bold">
              Add New User
            </h1>

            <form id="userForm" class="row g-3">
              <div class="col-12 text-center mb-2">
                <label class="form-label d-block">Profile Picture</label>
                <div
                  class="d-flex align-items-center justify-content-center gap-3 flex-wrap"
                >
                  <img
                    id="previewImg"
                    src=""
                    alt="Preview"
                    style="
                      width: 55px;
                      height: 55px;
                      border-radius: 50%;
                      object-fit: cover;
                      border: 2px solid rgba(255, 255, 255, 0.2);
                      display: none;
                    "
                  />
                  <input
                    type="file"
                    id="inputImageFile"
                    accept="image/*"
                    style="display: none"
                    onchange="handleImageUpload(event)"
                  />
                  <button
                    type="button"
                    class="btn btn-outline-primary btn-sm rounded-pill px-3"
                    onclick="document.getElementById('inputImageFile').click()"
                  >
                    Upload
                  </button>
                  <button
                    type="button"
                    class="btn btn-outline-secondary btn-sm rounded-pill px-3"
                    onclick="openCameraModal()"
                  >
                    Camera
                  </button>
                  <button
                    type="button"
                    class="btn btn-outline-success btn-sm rounded-pill px-3"
                    onclick="captureRemote()"
                  >
                    Capture
                  </button>

                  <div
                    id="livePanel"
                    style="
                      width: 150px;
                      border: 1px solid rgba(255, 255, 255, 0.25);
                      border-radius: 8px;
                      overflow: hidden;
                      text-align: center;
                    "
                  >
                    <img
                      id="remoteVideo"
                      alt="live"
                      style="
                        width: 100%;
                        display: block;
                        background: #000;
                        min-height: 90px;
                      "
                    />
                    <small
                      id="remoteStatus"
                      style="display: block; padding: 3px"
                      >Connecting...</small
                    >
                  </div>
                </div>
                <input type="hidden" id="inputImageBase64" />
              </div>

              <div class="col-12">
                <label for="name" class="form-label">Name</label>
                <input
                  type="text"
                  id="name"
                  class="form-control"
                  placeholder="ahmed ibrahim"
                  required
                />
              </div>

              <div class="col-12">
                <label for="gender" class="form-label">Gender</label>
                <select id="gender" class="form-select" required>
                  <option value="" selected disabled>Choose...</option>
                  <option value="male">Male</option>
                  <option value="female">Female</option>
                </select>
              </div>

              <div class="col-12">
                <label for="phone" class="form-label">Phone</label>
                <input
                  type="tel"
                  id="phone"
                  class="form-control"
                  placeholder="256544"
                  maxlength="10"
                  inputmode="numeric"
                  required
                />
              </div>

              <div class="col-12">
                <label for="email" class="form-label">Email</label>
                <input
                  type="email"
                  id="email"
                  class="form-control"
                  placeholder="ahemd@gmail.com"
                  required
                />
              </div>

              <div class="col-12">
                <label for="date" class="form-label">Birth Date</label>
                <input type="date" id="date" class="form-control" required />
              </div>

              <div
                class="col-12 text-center mt-4 d-flex justify-content-center gap-3"
              >
                <button
                  type="submit"
                  class="btn btn-primary rounded-pill px-4 py-2 fw-semibold"
                >
                  Save
                </button>
                <a
                  href="./index.html"
                  class="btn btn-secondary rounded-pill px-4 py-2 fw-semibold"
                >
                  Back
                </a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <div class="modal fade" id="cameraModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content bg-dark text-white border-secondary">
          <div class="modal-header border-0">
            <h5 class="modal-title">Take Photo</h5>
            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
              aria-label="Close"
              onclick="closeCameraModal()"
            ></button>
          </div>
          <div class="modal-body text-center">
            <video
              id="webcamVideo"
              autoplay
              playsinline
              style="
                width: 100%;
                max-height: 250px;
                border-radius: 8px;
                background: #000;
              "
            ></video>
            <canvas id="webcamCanvas" style="display: none"></canvas>
          </div>
          <div class="modal-footer border-0 justify-content-center">
            <button
              type="button"
              class="btn btn-primary rounded-pill px-4"
              onclick="captureWebcam()"
            >
              Capture
            </button>
            <button
              type="button"
              class="btn btn-secondary rounded-pill px-4"
              data-bs-dismiss="modal"
              onclick="closeCameraModal()"
            >
              Cancel
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./newuser.js"></script>
  </body>
</html>
